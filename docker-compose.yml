---
# Voice Runtime: realtime speech I/O for Companion Runtime.
#
# The brain is NOT part of this compose file on purpose: it lives in its own
# repo/service. Point VOICE_RUNTIME_URL at wherever the brain runs
# (host network, sibling compose project, or remote host).
services:
  voice:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    ports:
      - ${VOICE_PORT:-3002}:3002/tcp
    environment:
      VOICE_PORT: "3002"
      VOICE_RUNTIME_URL: ${VOICE_RUNTIME_URL:-http://host.docker.internal:8080}
      VOICE_RUNTIME_SECRET: ${VOICE_RUNTIME_SECRET:?Set VOICE_RUNTIME_SECRET before starting}
      VOICE_STT_BACKEND: ${VOICE_STT_BACKEND:-elevenlabs-realtime}
      VOICE_TTS_BACKEND: ${VOICE_TTS_BACKEND:-lemonfox}
      VOICE_LEMONFOX_VOICE: ${VOICE_LEMONFOX_VOICE:-aoede}
      LEMONFOX_API_KEY: ${LEMONFOX_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./cache/:/root/.cache/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
